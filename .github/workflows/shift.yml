name: Agent Shift

on:
  # Fires every 30 min; agent decides whether to actually run based on next-wake.txt
  schedule:
    - cron: "*/30 * * * *"

  # Manual trigger from GitHub UI — always runs regardless of wake time
  workflow_dispatch:
    inputs:
      force:
        description: "Force run even if not yet scheduled wake time"
        type: boolean
        default: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  shift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/garbage-time-agent-0a3Tg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for API key
        run: |
          if [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "::notice::ANTHROPIC_API_KEY secret is not set. Add it under Settings > Secrets and variables > Actions, then re-run."
            exit 0
          fi
          echo "API key present."

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run shift
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
          DAILY_POST_CAP: ${{ vars.DAILY_POST_CAP || '6' }}
          DAILY_API_BUDGET_USD: ${{ vars.DAILY_API_BUDGET_USD || '5' }}
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Force run"
            npm run force-shift
          else
            echo "Scheduled run — checking wake time"
            npm run shift
          fi

      - name: Commit and push workdir changes
        run: |
          git config user.name "Garbage Time Agent"
          git config user.email "agent@garbagetime.ai"
          git add workdir/
          if git diff --cached --quiet; then
            echo "No workdir changes to commit"
          else
            git commit -m "shift: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin claude/garbage-time-agent-0a3Tg
          fi
